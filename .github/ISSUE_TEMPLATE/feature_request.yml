name: Feature request
description: Suggest an improvement or a new applet
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes: { label: What would you like to see?, description: "Describe the use case, not only the solution." }
    validations: { required: true }
  - type: textarea
    id: alt
    attributes: { label: Alternatives you considered }
